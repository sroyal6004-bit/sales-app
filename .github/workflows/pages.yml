name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (중간 배포는 취소하지 않고 대기)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 배포마다 고유 빌드 ID를 심어, 열려 있는 화면이 새 버전을 감지해 자동 반영하게 함
      - name: Stamp build id
        run: |
          BUILD_ID="${GITHUB_SHA}-$(date +%s)"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" index.html sw.js
          echo "Stamped build id: ${BUILD_ID}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
