<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="골프노트"/>
  <meta name="theme-color" content="#4ade80"/>
  <title>골프 노트</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0f0b; --bg2: #0e150f; --bg3: #101a12;
      --border: #1a281c; --border2: #263a29;
      --accent: #4ade80; --accent2: #22a35a; --accent-dim: #16351f;
      --text: #eef2ec; --text2: #c4ccc2; --muted: #6b7a6d; --muted2: #47543f;
      --warm: #f4a94a; --red: #e0607a; --blue: #6fb3e0;
      --mono: 'DM Mono', monospace; --sans: 'Noto Sans KR', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; }
    #app { min-height: 100vh; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 10;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 14px;
      background: linear-gradient(180deg, #0d150e 0%, rgba(10,15,11,0.95) 100%);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    }
    .header-badge { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
    .header-title { font-size: 22px; font-weight: 900; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 300; }
    .sync-pill {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px;
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 20px;
      background: var(--bg3); border: 1px solid var(--border2); font-size: 11.5px; font-weight: 500;
      color: var(--text2); cursor: pointer; -webkit-appearance: none; transition: all 0.15s;
    }
    .sync-pill:active { transform: scale(0.96); }
    .sync-pill.on { border-color: var(--accent2); color: var(--accent); background: var(--accent-dim); }
    .sync-pill.error { border-color: #5a2a34; color: var(--red); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .sync-pill.on .sync-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .sync-pill.connecting .sync-dot { background: var(--warm); animation: pulse 1s infinite; }
    .sync-pill.error .sync-dot { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Tabs */
    .tabs { display: flex; gap: 6px; margin-top: 16px; background: var(--bg3); padding: 4px; border-radius: 12px; }
    .tab {
      flex: 1; padding: 10px; border-radius: 9px; border: none; background: none;
      color: var(--muted); font-family: var(--sans); font-size: 13.5px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; -webkit-appearance: none;
    }
    .tab.active { background: var(--accent-dim); color: var(--accent); }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .stat-card { background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 10px; text-align: center; }
    .stat-num { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-num.warm { color: var(--warm); } .stat-num.blue { color: var(--blue); }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 0.02em; }

    .main { padding: 16px 20px; max-width: 620px; margin: 0 auto; }

    /* Search + filter */
    .search-box { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
    .search-box input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 14px; }
    .search-box input::placeholder { color: var(--muted2); }
    .search-icon { font-size: 15px; opacity: 0.6; }
    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--border2); font-size: 12.5px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; -webkit-appearance: none; }
    .chip:active { transform: scale(0.96); }
    .chip.active { background: var(--accent-dim); border-color: var(--accent2); color: var(--accent); }
    .chip .cnt { font-family: var(--mono); font-size: 10px; opacity: 0.7; margin-left: 4px; }

    /* Note cards */
    .note-list, .round-list { display: flex; flex-direction: column; gap: 12px; }
    .note-card, .round-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; padding: 16px; transition: border-color 0.15s; }
    .note-card:active, .round-card:active { border-color: var(--accent2); }
    .note-top, .round-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .note-cat { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-dim); padding: 3px 9px; border-radius: 8px; }
    .note-date, .round-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .note-date { margin-left: auto; }
    .note-menu { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1; -webkit-appearance: none; margin-left: auto; }
    .note-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.35; }
    .note-body { font-size: 13.5px; color: var(--text2); line-height: 1.7; margin-top: 7px; white-space: pre-wrap; word-break: break-word; }
    .note-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .tag { font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--bg3); padding: 3px 8px; border-radius: 6px; }
    .tag::before { content: '#'; opacity: 0.5; }

    /* Media */
    .note-media { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
    .media-tile { width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--bg3); border: 1px solid var(--border2); position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .media-tile img, .media-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-tile.clickable { cursor: pointer; } .media-tile.clickable:active { opacity: 0.8; }
    .media-missing { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.5; padding: 4px; }
    .media-rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(0,0,0,0.72); color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; -webkit-appearance: none; }
    .media-spin { font-size: 16px; animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    .media-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .media-add { display: inline-flex; align-items: center; gap: 6px; padding: 11px 16px; border-radius: 10px; background: var(--bg3); border: 1px dashed var(--border2); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; }
    .media-add:active { border-color: var(--accent2); color: var(--accent); }
    .lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.94); display: none; align-items: center; justify-content: center; }
    .lightbox.show { display: flex; }
    .lb-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; touch-action: pan-y; }
    .lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; border-radius: 8px; user-select: none; -webkit-user-drag: none; }
    .lb-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); }
    .lb-count { font-family: var(--mono); font-size: 13px; color: #fff; opacity: 0.9; }
    .lb-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; -webkit-appearance: none; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.14); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-appearance: none; }
    .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
    .lb-nav:disabled { opacity: 0.25; }

    /* Round card */
    .round-course { font-size: 13px; font-weight: 700; color: var(--text2); }
    .round-score { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--text); }
    .round-score span { font-size: 13px; color: var(--muted); margin-left: 2px; }
    .round-score em { font-style: normal; font-size: 15px; margin-left: 8px; font-weight: 500; }
    .round-score em.over { color: var(--red); } .round-score em.under { color: var(--accent); } .round-score em.even { color: var(--warm); }
    .round-meta { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .round-meta b { color: var(--text2); font-family: var(--mono); }
    .round-memo { font-size: 12.5px; color: var(--text2); line-height: 1.6; margin-top: 9px; white-space: pre-wrap; }

    /* Graph */
    .graph-wrap { background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; padding: 16px 12px 10px; margin-bottom: 18px; }
    .graph-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 4px 8px; letter-spacing: 0.03em; }
    .graph-wrap svg { width: 100%; height: auto; display: block; }
    .graph-empty { text-align: center; color: var(--muted2); font-size: 13px; line-height: 1.7; padding: 30px 10px; }

    /* Empty */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.8; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; color: var(--muted2); line-height: 1.6; }

    /* FAB */
    .fab { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); right: 22px; z-index: 50; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #06120a; font-size: 28px; font-weight: 300; cursor: pointer; box-shadow: 0 8px 24px rgba(34,163,90,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; -webkit-appearance: none; }
    .fab:active { transform: scale(0.92); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.show { display: flex; }
    .modal { width: 100%; max-width: 620px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); max-height: 92vh; overflow-y: auto; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border2); margin: 0 auto 18px; }
    .modal-title { font-size: 17px; font-weight: 900; margin-bottom: 18px; }
    .field { margin-bottom: 15px; }
    .field-row { display: flex; gap: 10px; } .field-row .field { flex: 1; }
    .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 7px; }
    .field input, .field textarea, .field select { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 13px; color: var(--text); font-family: var(--sans); font-size: 14px; outline: none; -webkit-appearance: none; }
    .field input:focus, .field textarea:focus { border-color: var(--accent2); }
    .field textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
    .cat-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .cat-opt { padding: 8px 12px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--border2); font-size: 12.5px; color: var(--text2); cursor: pointer; transition: all 0.12s; -webkit-appearance: none; }
    .cat-opt.active { background: var(--accent-dim); border-color: var(--accent2); color: var(--accent); font-weight: 700; }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-family: var(--sans); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: transform 0.12s; -webkit-appearance: none; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06120a; }
    .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); flex: 0 0 auto; padding: 14px 20px; }
    .btn-danger { background: transparent; border: 1px solid #5a2a34; color: var(--red); }

    /* Sync modal */
    .sync-desc { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 18px; }
    .code-box { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 6px 6px 6px 14px; margin-bottom: 8px; }
    .code-box input { flex: 1; background: none; border: none; outline: none; color: var(--accent); font-family: var(--mono); font-size: 16px; letter-spacing: 0.04em; }
    .copy-btn { padding: 9px 13px; border-radius: 9px; border: none; background: var(--accent-dim); color: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; -webkit-appearance: none; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.7; background: var(--bg3); border-radius: 10px; padding: 12px 14px; margin: 14px 0 4px; border-left: 2px solid var(--border2); }
    .hint b { color: var(--text2); }
    .status-line { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
    .status-line b { color: var(--accent); }

    /* Sheet */
    .sheet-backdrop { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; }
    .sheet-backdrop.show { display: flex; }
    .sheet { width: 100%; max-width: 620px; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px); animation: slideUp 0.2s ease-out; }
    .sheet-group { background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
    .sheet-item { width: 100%; padding: 16px; background: none; border: none; color: var(--text); font-family: var(--sans); font-size: 15px; text-align: center; cursor: pointer; border-bottom: 1px solid var(--border); -webkit-appearance: none; }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-item.danger { color: var(--red); } .sheet-item.cancel { color: var(--muted); font-weight: 700; }

    /* Backup */
    .backup-bar { display: flex; gap: 10px; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .backup-btn { flex: 1; min-width: 130px; padding: 11px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--border2); color: var(--muted); font-family: var(--sans); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 0.15s; -webkit-appearance: none; }
    .backup-btn:active { background: var(--bg3); }

    .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--accent2); color: var(--accent); padding: 11px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: all 0.25s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #install-banner { display: none; position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); left: 12px; right: 12px; z-index: 90; background: linear-gradient(135deg, #10251a, #14311f); border: 1px solid #1f4a30; border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    #install-banner.show { display: flex; align-items: center; gap: 12px; }
    .banner-text { flex: 1; font-size: 13px; color: #9fe0b6; line-height: 1.4; }
    .banner-text strong { color: var(--accent); font-size: 14px; display: block; margin-bottom: 2px; }
    .banner-btn { padding: 10px 16px; background: var(--accent); border: none; border-radius: 10px; font-family: var(--sans); font-size: 13px; font-weight: 700; color: #06120a; cursor: pointer; white-space: nowrap; -webkit-appearance: none; }
    .banner-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="sync-pill" id="syncBtn"><span class="sync-dot"></span><span id="syncPillText">동기화</span></button>
    <div class="header-badge">Golf Journal · PWA</div>
    <div class="header-title">⛳ 골프 노트</div>
    <div class="header-sub">배운 것과 라운드 스코어를 한곳에</div>
    <div class="tabs">
      <button class="tab active" data-view="notes" id="tabNotes">📝 학습 노트</button>
      <button class="tab" data-view="rounds" id="tabRounds">📊 스코어</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div class="main">
    <!-- 학습 노트 뷰 -->
    <div id="viewNotes">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="제목·내용·태그 검색"/>
      </div>
      <div class="filter-scroll" id="filterScroll"></div>
      <div class="note-list" id="noteList"></div>
      <div class="backup-bar">
        <button class="backup-btn" id="syncBtn2">☁️ 기기 간 동기화 설정</button>
        <button class="backup-btn" id="exportBtn">📤 백업 내보내기</button>
        <button class="backup-btn" id="importBtn">📥 백업 가져오기</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none"/>
      </div>
    </div>

    <!-- 스코어 뷰 -->
    <div id="viewRounds" style="display:none">
      <div class="graph-wrap">
        <div class="graph-title">📈 스코어 추이 (낮을수록 좋아요)</div>
        <div id="graph"></div>
      </div>
      <div class="round-list" id="roundList"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="추가">+</button>

<!-- 노트 모달 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">새 노트</div>
    <div class="field"><label class="field-label">카테고리</label><div class="cat-picker" id="catPicker"></div></div>
    <div class="field"><label class="field-label">날짜</label><input type="date" id="fDate"/></div>
    <div class="field"><label class="field-label">제목</label><input type="text" id="fTitle" placeholder="예) 백스윙 탑에서 손목 코킹 유지"/></div>
    <div class="field"><label class="field-label">배운 내용 · 메모</label><textarea id="fBody" placeholder="레슨 내용, 유튜브에서 배운 팁, 라운드 중 느낀 점 등"></textarea></div>
    <div class="field"><label class="field-label">태그 (쉼표로 구분)</label><input type="text" id="fTags" placeholder="예) 드라이버, 슬라이스교정"/></div>
    <div class="field">
      <label class="field-label">사진 · 동영상</label>
      <div class="media-preview" id="mediaPreview"></div>
      <label class="media-add"><input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none"/>📎 사진/동영상 추가</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>

// ══════════════════════════════════════════════════════════
const uiStack = [];
function pushHist(tag) { try { history.pushState({ golf: tag }, ''); return true; } catch { return false; } }
function openLayer(tag, prep) {
  if (prep) prep();
  showLayer(tag);
  const pushed = pushHist(tag);
  uiStack.push({ tag, pushed });
}
function swapLayer(tag, prep) {
  const top = uiStack[uiStack.length - 1];
  if (top) hideLayer(top.tag);
  if (prep) prep();
  showLayer(tag);
  if (top) top.tag = tag; else { const pushed = pushHist(tag); uiStack.push({ tag, pushed }); }
}
function uiBack() {
  const top = uiStack[uiStack.length - 1];
  if (!top) return;
  if (top.pushed) history.back();          // popstate가 실제 닫기를 처리
  else { uiStack.pop(); hideLayer(top.tag); }
}
window.addEventListener('popstate', () => {
  if (!uiStack.length) return;             // 홈 → 브라우저 기본(종료/이전 페이지)
  const top = uiStack.pop();
  hideLayer(top.tag);
});
function showLayer(tag) {
  switch (tag) {
    case 'noteModal': $('modalBackdrop').classList.add('show'); setTimeout(() => $('fTitle').focus(), 100); break;
    case 'roundModal': $('roundBackdrop').classList.add('show'); setTimeout(() => $('rScore').focus(), 100); break;
    case 'syncModal': $('syncBackdrop').classList.add('show'); break;
    case 'sheet': $('sheetBackdrop').classList.add('show'); break;
    case 'lightbox': $('lightbox').classList.add('show'); break;
    case 'rounds': activeView = 'rounds'; syncTabs(); render(); break;
  }
}
function hideLayer(tag) {
  switch (tag) {
    case 'noteModal': closeModal(); break;
    case 'roundModal': closeRoundModal(); break;
    case 'syncModal': $('syncBackdrop').classList.remove('show'); break;
    case 'sheet': $('sheetBackdrop').classList.remove('show'); break;
    case 'lightbox': $('lightbox').classList.remove('show'); $('lightbox').innerHTML = ''; break;
    case 'rounds': activeView = 'notes'; syncTabs(); render(); break;
  }
}
function syncTabs() { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.view === activeView)); }

// ── 로드/저장 ───────────────────────────────────────────────
function loadArr(key) {
  try {
    const arr = JSON.parse(localStorage.getItem(key)) || [];
    if (key === NOTE_KEY || key === ROUND_KEY) arr.forEach(n => { if (!n.updated) n.updated = n.created || Date.now(); });
    return arr;
  } catch { return []; }
}
function persist() {
  localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
  localStorage.setItem(ROUND_KEY, JSON.stringify(rounds));
}
function markUploaded(id) { uploaded.add(id); localStorage.setItem(UP_KEY, JSON.stringify([...uploaded])); }
function activeNotes() { return notes.filter(n => !n.deleted); }
function activeRounds() { return rounds.filter(r => !r.deleted); }
function commit() { persist(); render(); pushToCloud(); }

// ── 미디어 로컬 저장소 (IndexedDB) ──────────────────────────
const MEDIA_DB = 'golf-media', MEDIA_STORE = 'files';
let _mediaDbPromise = null;
function mediaDB() {
  if (_mediaDbPromise) return _mediaDbPromise;
  _mediaDbPromise = new Promise((res, rej) => {
    try {
      const req = indexedDB.open(MEDIA_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(MEDIA_STORE, { keyPath: 'id' });
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    } catch (e) { rej(e); }
  });
  return _mediaDbPromise;
}
async function mediaPut(rec) {
  const db = await mediaDB();
  return new Promise((res, rej) => { const tx = db.transaction(MEDIA_STORE, 'readwrite'); tx.objectStore(MEDIA_STORE).put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function mediaGet(id) {
  const db = await mediaDB();
  return new Promise((res, rej) => { const tx = db.transaction(MEDIA_STORE, 'readonly'); const r = tx.objectStore(MEDIA_STORE).get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
}
async function mediaDeleteLocal(id) {
  try { const db = await mediaDB(); await new Promise(res => { const tx = db.transaction(MEDIA_STORE, 'readwrite'); tx.objectStore(MEDIA_STORE).delete(id); tx.oncomplete = res; tx.onerror = res; }); } catch {}
}
// 로컬 + 클라우드 완전 삭제
async function deleteMediaEverywhere(id) {
  forgetMediaUrl(id);
  await mediaDeleteLocal(id);
  uploaded.delete(id); localStorage.setItem(UP_KEY, JSON.stringify([...uploaded]));
  if (fb && fb.storage && syncCode) { try { await fb.st.deleteObject(fb.st.ref(fb.storage, `spaces/${syncCode}/${id}`)); } catch {} }
}

// 한 번 만든 이미지 URL을 메모리에 캐시 → 재렌더 시 즉시 표시(다시 안 읽음)
const mediaUrlCache = new Map();
async function resolveMediaUrl(m) {
  if (mediaUrlCache.has(m.id)) return mediaUrlCache.get(m.id);
  const url = await mediaSrc(m).catch(() => null);
  if (url) mediaUrlCache.set(m.id, url);
  return url;
}
function forgetMediaUrl(id) {
  const u = mediaUrlCache.get(id);
  if (u && u.startsWith('blob:')) { try { URL.revokeObjectURL(u); } catch {} }
  mediaUrlCache.delete(id);
}

// 미디어 표시용 src 얻기: 로컬 우선 → 없으면 클라우드
async function mediaSrc(m) {
  try { const rec = await mediaGet(m.id); if (rec && rec.blob) return URL.createObjectURL(rec.blob); } catch {}
  if (fb && fb.storage && syncCode) {
    try {
      const url = await fb.st.getDownloadURL(fb.st.ref(fb.storage, `spaces/${syncCode}/${m.id}`));
      // 백그라운드로 로컬 캐시 (실패해도 무시)
      (async () => { try { const resp = await fetch(url); if (resp.ok) { const bl = await resp.blob(); await mediaPut({ id: m.id, type: m.type, mime: m.mime || bl.type, name: m.name, blob: bl }); markUploaded(m.id); } } catch {} })();
      return url;
    } catch {}
  }
  return null;
}

// ══════════════════════════════════════════════════════════
//  렌더링
// ══════════════════════════════════════════════════════════
function render() {
  if (activeView === 'notes') {
    $('viewNotes').style.display = ''; $('viewRounds').style.display = 'none';

    $('viewNotes').style.display = 'none'; $('viewRounds').style.display = '';

}

function renderNoteStats() {
  const live = activeNotes();
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const month = live.filter(n => (n.date||'').startsWith(ym)).length;
  $('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${live.length}</div><div class="stat-label">전체 노트</div></div>
    <div class="stat-card"><div class="stat-num">${month}</div><div class="stat-label">이번 달</div></div>
    <div class="stat-card"><div class="stat-num warm">${calcStreak(live)}</div><div class="stat-label">연속 기록일</div></div>`;
}
function calcStreak(live) {
  if (!live.length) return 0;
  const days = new Set(live.map(n => n.date).filter(Boolean));
  let streak = 0, d = new Date();
  const key = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  if (!days.has(key(d))) d.setDate(d.getDate() - 1);
  while (days.has(key(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

function renderFilters() {
  const live = activeNotes(), counts = {};
  live.forEach(n => counts[n.cat] = (counts[n.cat]||0) + 1);
  const items = [{ id: 'all', label: '전체', emoji: '📋', cnt: live.length }]

function filteredNotes() {

    .filter(n => activeFilter === 'all' || n.cat === activeFilter)
    .filter(n => !term || `${n.title} ${n.body} ${(n.tags||[]).join(' ')}`.toLowerCase().includes(term))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
}

function renderNotes() {

      <div class="note-title">${esc(n.title) || '(제목 없음)'}</div>

function fillTile(tile, m, url, arr, idx) {
  tile.classList.add('clickable');
  if (m.type === 'video') { tile.innerHTML = `<video src="${url}" preload="metadata" muted playsinline></video>`; }
  else { tile.innerHTML = `<img src="${url}" loading="lazy"/>`; }
  tile.onclick = () => openGallery(arr, idx);
}
function loadTile(tile) {
  const m = tile._m;
  resolveMediaUrl(m).then(url => {
    if (!url) {
      const waiting = syncCode && syncStatus !== 'on';   // 아직 연결 중이면 곧 다시 시도됨
      tile.innerHTML = `<span class="media-missing">${m.type==='video'?'🎬':'🖼️'}<br/>${waiting ? '동기화 대기…' : '불러올 수 없음'}</span>`;
      return;
    }
    fillTile(tile, m, url, tile._arr, tile._idx);
  });
}
// 지연 로딩: 화면에 보이는(가까워진) 썸네일만 읽어옴 → 데이터가 많아도 첫 로딩이 빠름
let mediaObserver = null;
function onTileVisible(entries) {
  for (const en of entries) if (en.isIntersecting) { mediaObserver.unobserve(en.target); loadTile(en.target); }
}
function hydrateCardMedia() {
  if (mediaObserver) mediaObserver.disconnect();
  const useIO = 'IntersectionObserver' in window;
  if (useIO) mediaObserver = new IntersectionObserver(onTileVisible, { rootMargin: '300px' });
  document.querySelectorAll('.note-media').forEach(wrap => {
    const n = notes.find(x => x.id === wrap.dataset.media);
    if (!n || !n.media) return;
    wrap.innerHTML = '';
    n.media.forEach((m, idx) => {
      const tile = document.createElement('div');
      tile.className = 'media-tile';
      wrap.appendChild(tile);
      const cached = mediaUrlCache.get(m.id);
      if (cached) { fillTile(tile, m, cached, n.media, idx); return; }   // 캐시 → 즉시
      tile.innerHTML = '<span class="media-spin">⏳</span>';
      tile._m = m; tile._arr = n.media; tile._idx = idx;
      if (useIO) mediaObserver.observe(tile); else loadTile(tile);
    });
  });
}
// ── 사진 갤러리(라이트박스) — 스와이프로 넘겨보기 ──────────
let lbItems = [], lbIndex = 0;
function openGallery(mediaArr, startIdx) {
  lbItems = mediaArr || []; lbIndex = startIdx || 0;
  openLayer('lightbox', renderLightbox);
}
async function renderLightbox() {
  const lb = $('lightbox');
  const m = lbItems[lbIndex];
  if (!m) { lb.innerHTML = ''; return; }
  const multi = lbItems.length > 1;
  lb.innerHTML = `
    <div class="lb-top">
      <span class="lb-count">${multi ? `${lbIndex+1} / ${lbItems.length}` : ''}</span>
      <button class="lb-close" id="lbClose">×</button>
    </div>
    <div class="lb-stage" id="lbStage"><span class="media-spin">⏳</span></div>
    ${multi ? `<button class="lb-nav prev" id="lbPrev" ${lbIndex===0?'disabled':''}>‹</button><button class="lb-nav next" id="lbNext" ${lbIndex===lbItems.length-1?'disabled':''}>›</button>` : ''}`;
  $('lbClose').onclick = e => { e.stopPropagation(); uiBack(); };
  if (multi) {
    $('lbPrev').onclick = e => { e.stopPropagation(); lbGo(-1); };
    $('lbNext').onclick = e => { e.stopPropagation(); lbGo(1); };
    [lbIndex-1, lbIndex+1].forEach(i => { if (lbItems[i]) resolveMediaUrl(lbItems[i]); }); // 이웃 미리 로딩
  }
  const url = await resolveMediaUrl(m).catch(() => null);
  if (lbItems[lbIndex] !== m) return; // 그새 넘어갔으면 무시
  const stage = $('lbStage'); if (!stage) return;
  stage.innerHTML = url
    ? (m.type === 'video' ? `<video src="${url}" controls autoplay playsinline></video>` : `<img src="${url}"/>`)
    : `<span class="media-missing">불러올 수 없음</span>`;
}
function lbGo(d) { const n = lbIndex + d; if (n < 0 || n >= lbItems.length) return; lbIndex = n; renderLightbox(); }

// 스와이프 & 키보드 (한 번만 등록)
(() => {
  const lb = $('lightbox');
  let x0 = null, y0 = null;
  lb.addEventListener('click', e => { if (e.target === lb || e.target.id === 'lbStage') uiBack(); });
  lb.addEventListener('touchstart', e => { const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) lbGo(dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener('keydown', e => {
    if (!lb.classList.contains('show')) return;
    if (e.key === 'ArrowLeft') lbGo(-1);
    else if (e.key === 'ArrowRight') lbGo(1);
    else if (e.key === 'Escape') uiBack();
  });
})();

// ── 라운드(스코어) 렌더 ─────────────────────────────────────
function renderRoundStats() {
  const live = activeRounds().filter(r => typeof r.score === 'number');
  const scores = live.map(r => r.score);
  const best = scores.length ? Math.min(...scores) : '—';
  const sorted = live.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.created - a.created);
  const recent = sorted.slice(0, 5).map(r => r.score);
  const avg = recent.length ? Math.round(recent.reduce((s,v)=>s+v,0)/recent.length) : '—';
  $('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num blue">${live.length}</div><div class="stat-label">총 라운드</div></div>
    <div class="stat-card"><div class="stat-num">${best}</div><div class="stat-label">베스트 스코어</div></div>
    <div class="stat-card"><div class="stat-num warm">${avg}</div><div class="stat-label">평균(최근5)</div></div>`;
}

function renderRounds() {
  const list = activeRounds().sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.created - a.created);
  if (!list.length) {
    $('roundList').innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">첫 라운드를 기록해보세요</div><div class="empty-sub">오른쪽 아래 <b>+</b> 버튼으로<br/>라운드 스코어를 남기면 추이 그래프가 그려져요.</div></div>`;
    return;
  }
  $('roundList').innerHTML = list.map(r => {
    const par = Number(r.par) || 72;
    const diff = (typeof r.score === 'number') ? r.score - par : null;
    const diffCls = diff === null ? '' : diff > 0 ? 'over' : diff < 0 ? 'under' : 'even';
    const diffTxt = diff === null ? '' : diff > 0 ? `+${diff}` : diff < 0 ? `${diff}` : 'E';
    const meta = [];
    if (r.putts) meta.push(`퍼팅 <b>${esc(String(r.putts))}</b>`);
    meta.push(`파 <b>${par}</b>`);
    return `<div class="round-card">
      <div class="round-top"><span class="round-date">${fmtDate(r.date)}</span>${r.course?`<span class="round-course">${esc(r.course)}</span>`:''}<button class="note-menu" data-round="${r.id}">⋯</button></div>
      <div class="round-score">${typeof r.score==='number'?r.score:'—'}<span>타</span>${diffTxt?`<em class="${diffCls}">${diffTxt}</em>`:''}</div>
      <div class="round-meta">${meta.map(x=>`<span>${x}</span>`).join('')}</div>
      ${r.memo?`<div class="round-memo">${esc(r.memo)}</div>`:''}
    </div>`;
  }).join('');
}

function renderGraph() {
  const el = $('graph');
  const live = activeRounds().filter(r => typeof r.score === 'number')
    .sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.created - b.created).slice(-20);
  if (live.length < 2) { el.innerHTML = `<div class="graph-empty">라운드를 <b>2회 이상</b> 기록하면<br/>스코어 추이 그래프가 나타나요 📈</div>`; return; }
  const scores = live.map(r => r.score);
  const min = Math.min(...scores), max = Math.max(...scores);
  const pad = Math.max(2, Math.round((max - min) * 0.2));
  const lo = min - pad, hi = max + pad, range = (hi - lo) || 1;
  const W = 600, H = 210, L = 42, R = 14, T = 22, B = 40;
  const px = i => L + (W - L - R) * (i / (live.length - 1));
  const py = v => T + (H - T - B) * (1 - (v - lo) / range);
  const pts = live.map((r, i) => `${px(i).toFixed(1)},${py(r.score).toFixed(1)}`).join(' ');
  const area = `${L},${H-B} ${pts} ${W-R},${H-B}`;
  const circles = live.map((r, i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(r.score).toFixed(1)}" r="4" fill="#4ade80" stroke="#0e150f" stroke-width="2"/>`).join('');
  const vals = live.map((r, i) => `<text x="${px(i).toFixed(1)}" y="${(py(r.score)-11).toFixed(1)}" fill="#c4ccc2" font-size="13" font-family="monospace" text-anchor="middle">${r.score}</text>`).join('');
  const yLabels = [hi, Math.round((hi+lo)/2), lo].map(v => `<text x="${L-8}" y="${(py(v)+4).toFixed(1)}" fill="#6b7a6d" font-size="11" font-family="monospace" text-anchor="end">${v}</text><line x1="${L}" y1="${py(v).toFixed(1)}" x2="${W-R}" y2="${py(v).toFixed(1)}" stroke="#1a281c" stroke-width="1"/>`).join('');
  const idxs = live.length <= 4 ? live.map((_,i)=>i) : [0, Math.floor((live.length-1)/2), live.length-1];
  const xLabels = idxs.map(i => `<text x="${px(i).toFixed(1)}" y="${H-14}" fill="#6b7a6d" font-size="11" font-family="monospace" text-anchor="middle">${shortDate(live[i].date)}</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="스코어 추이 그래프">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ade80" stop-opacity="0.28"/><stop offset="100%" stop-color="#4ade80" stop-opacity="0"/></linearGradient></defs>
    ${yLabels}
    <polygon points="${area}" fill="url(#ga)"/>
    <polyline points="${pts}" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${circles}${vals}${xLabels}
  </svg>`;
}

//  기기 간 동기화 (Firestore + Storage)
// ══════════════════════════════════════════════════════════
function setSyncStatus(s) {
  syncStatus = s;
  const pill = $('syncBtn');
  pill.className = 'sync-pill ' + (s==='on'?'on':s==='connecting'?'connecting':s==='error'?'error':'');
  $('syncPillText').textContent = s==='on'?'동기화 켜짐':s==='connecting'?'연결 중…':s==='error'?'동기화 오류':'동기화';
}
function mergeInto(base, incoming) {
  const map = {}; base.forEach(n => map[n.id] = n);
  (incoming||[]).forEach(n => { if (!n || !n.id) return; const ex = map[n.id]; if (!ex || (n.updated||0) > (ex.updated||0)) map[n.id] = n; });
  return Object.values(map);
}
function sig(ns, rs) {
  return [...ns.map(x=>`n${x.id}:${x.updated||0}:${x.deleted?1:0}`), ...rs.map(x=>`r${x.id}:${x.updated||0}:${x.deleted?1:0}`)].sort().join('|');
}

async function connectFirebase() {
  if (!syncCode) return;
  setSyncStatus('connecting');
  try {
    if (!fb) {
      const [appMod, fsMod, stMod] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`),
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-storage.js`),
      ]);
      const app = appMod.initializeApp(firebaseConfig);
      fb = { app, fs: fsMod, db: fsMod.getFirestore(app), st: stMod, storage: stMod.getStorage(app), ref: null, unsub: null };
    }
    if (fb.unsub) { fb.unsub(); fb.unsub = null; }
    fb.ref = fb.fs.doc(fb.db, 'spaces', syncCode);
    fb.unsub = fb.fs.onSnapshot(fb.ref, snap => {
      const d = snap.data() || {};
      const mn = mergeInto(notes, d.notes || []);
      const mr = mergeInto(rounds, d.rounds || []);
      if (sig(mn, mr) !== sig(notes, rounds)) { notes = mn; rounds = mr; persist(); render(); }
      if (sig(mn, mr) !== sig(d.notes || [], d.rounds || [])) pushToCloud();
      setSyncStatus('on');
    }, err => { console.warn('sync error', err); setSyncStatus('error'); });
    setSyncStatus('on');
    await pushToCloud();
    syncPendingMedia();
    if (activeView === 'notes') hydrateCardMedia();   // 연결 완료 후 클라우드 미디어 다시 로드
  } catch (e) { console.warn('firebase connect failed', e); setSyncStatus('error'); }
}
async function pushToCloud() {
  if (!fb || !fb.ref || syncStatus === 'off') return;
  try { await fb.fs.setDoc(fb.ref, { notes, rounds, updatedAt: Date.now() }); }
  catch (e) { console.warn('push failed', e); setSyncStatus('error'); }
}
async function uploadMedia(id, blob, mime) {
  if (!fb || !fb.storage || !syncCode) return false;
  try { await fb.st.uploadBytes(fb.st.ref(fb.storage, `spaces/${syncCode}/${id}`), blob, { contentType: mime || blob.type }); markUploaded(id); return true; }
  catch (e) { console.warn('upload', e); return false; }
}
// 오프라인에서 첨부했다가 나중에 켠 경우 등, 아직 안 올라간 미디어 업로드
async function syncPendingMedia() {
  if (!fb || !fb.storage || !syncCode) return;
  for (const n of notes) {
    if (n.deleted || !n.media) continue;
    for (const m of n.media) {
      if (uploaded.has(m.id)) continue;
      try { const rec = await mediaGet(m.id); if (rec && rec.blob) await uploadMedia(m.id, rec.blob, m.mime); } catch {}
    }
  }
}
function disableSync() {
  if (fb && fb.unsub) { fb.unsub(); fb.unsub = null; }
  fb = null; syncCode = null; localStorage.removeItem(CODE_KEY);
  setSyncStatus('off');
}
function genCode() {
  const alpha = '23456789abcdefghjkmnpqrstuvwxyz';
  const pick = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(x => alpha[x % alpha.length]).join('');
  return `golf-${pick(4)}-${pick(4)}`;
}

      <div class="sync-desc">아래 <b>연결 코드</b>를 다른 기기에 입력하면 노트·스코어·사진이 모두 함께 보여요.</div>

      <div class="modal-actions"><button class="btn btn-ghost" id="syncCancelBtn">닫기</button></div>`;
    $('regenBtn').addEventListener('click', () => { $('newCodeInput').value = genCode(); });
    $('startNewBtn').addEventListener('click', () => startSync($('newCodeInput').value));
    $('joinBtn').addEventListener('click', () => startSync($('joinCodeInput').value));
    $('syncCancelBtn').addEventListener('click', closeSync);

}
function startSync(raw) {
  const code = (raw||'').trim().toLowerCase();
  if (code.length < 10) { toast('코드는 10자 이상이어야 해요'); return; }
  if (!/^[a-z0-9-]+$/.test(code)) { toast('영문 소문자·숫자·하이픈만 사용하세요'); return; }
  syncCode = code; localStorage.setItem(CODE_KEY, code);
  renderSyncBody(); connectFirebase(); toast('동기화를 시작했어요 ☁️');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('코드를 복사했어요 ✓'); }
  catch { const el = $('syncCodeShow'); if (el) { el.select(); document.execCommand('copy'); toast('코드를 복사했어요 ✓'); } }
}
$('syncBtn').addEventListener('click', openSync);
$('syncBtn2').addEventListener('click', openSync);
$('syncBackdrop').addEventListener('click', e => { if (e.target === $('syncBackdrop')) closeSync(); });

// ── 사진 자동 압축 (최대 1280px, ~0.5MB) ───────────────────
function canvasToBlob(canvas, type, q) { return new Promise(res => canvas.toBlob(res, type, q)); }
async function compressImage(file, maxDim = 1280, targetBytes = 520000) {
  if (!file || !file.type || !file.type.startsWith('image/')) return file;
  try {
    let bitmap;
    try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch { bitmap = await createImageBitmap(file); }
    let w = bitmap.width, h = bitmap.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, w, h);
    if (bitmap.close) bitmap.close();
    let q = 0.72, blob = await canvasToBlob(canvas, 'image/jpeg', q);
    while (blob && blob.size > targetBytes && q > 0.4) { q -= 0.12; blob = await canvasToBlob(canvas, 'image/jpeg', q); }
    if (blob && blob.size < file.size) return blob;   // 압축 효과 있을 때만 사용
    return file;
  } catch { return file; }
}

// ── 유틸 ────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s) {
  if (!s) return '';
  const today = todayStr(); if (s === today) return '오늘';
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  if (s === yStr) return '어제';
  const [, m, d] = s.split('-'); return `${Number(m)}월 ${Number(d)}일`;
}
function shortDate(s) { if (!s) return ''; const [, m, d] = s.split('-'); return `${Number(m)}/${Number(d)}`; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

// ── PWA ─────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('install-banner').classList.add('show'); });
$('installBtn').addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; $('install-banner').classList.remove('show'); deferredPrompt = null; });
$('closeBanner').addEventListener('click', () => $('install-banner').classList.remove('show'));
window.addEventListener('appinstalled', () => { $('install-banner').classList.remove('show'); deferredPrompt = null; });
if ('serviceWorker' in navigator) {
  // 새 버전이 활성화되면 자동으로 한 번 새로고침해서 최신 화면을 보여줌
  if (navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
  }
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {}));
}

// ── 초기 실행 ───────────────────────────────────────────────
render();
setSyncStatus(syncCode ? 'connecting' : 'off');
if (syncCode) connectFirebase();
