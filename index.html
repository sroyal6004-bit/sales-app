<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#4ade80"/>
  <title>내 앱 모음</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
    :root{
      --bg:#0a0f0b; --bg2:#0e150f; --border:#263a29; --accent:#4ade80;
      --text:#eef2ec; --text2:#c4ccc2; --muted:#6b7a6d;
      --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
    .wrap{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 60px;}
    .badge{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
    h1{font-size:26px;font-weight:900;margin-bottom:6px;}
    .sub{font-size:13px;color:var(--muted);margin-bottom:30px;font-weight:300;}
    .grid{display:flex;flex-direction:column;gap:12px;}
    .card{
      display:flex;align-items:center;gap:16px;
      background:var(--bg2);border:1px solid var(--border);border-radius:16px;
      padding:18px 18px;text-decoration:none;color:inherit;
      transition:transform .12s,border-color .15s;
    }
    .card:active{transform:scale(.98);border-color:var(--accent);}
    .icon{
      width:52px;height:52px;flex-shrink:0;border-radius:14px;
      display:flex;align-items:center;justify-content:center;font-size:28px;
      background:#16351f;border:1px solid var(--border);
    }
    .meta{flex:1;min-width:0;}
    .name{font-size:16px;font-weight:700;margin-bottom:3px;}
    .desc{font-size:12.5px;color:var(--muted);line-height:1.5;}
    .arrow{color:var(--muted);font-size:20px;flex-shrink:0;}
    .foot{margin-top:34px;text-align:center;font-size:11.5px;color:#47543f;line-height:1.8;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">My Apps</div>
    <h1>📱 내 앱 모음</h1>
    <div class="sub">아래에서 앱을 선택하세요. 각 앱은 독립적으로 저장·동기화됩니다.</div>
    <div class="grid">
      <a class="card" href="./golf/">
        <div class="icon">⛳</div>
        <div class="meta"><div class="name">골프 노트</div><div class="desc">골프 공부 기록 · 라운드 스코어 · 사진/동영상</div></div>
        <div class="arrow">›</div>
      </a>
      <a class="card" href="./leave/">
        <div class="icon">🗓️</div>
        <div class="meta"><div class="name">직원 휴무 스케쥴</div><div class="desc">직원 휴무 일정 관리</div></div>
        <div class="arrow">›</div>
      </a>
      <a class="card" href="./contract/">
        <div class="icon">📄</div>
        <div class="meta"><div class="name">계약서 기록 관리</div><div class="desc">계약 정보 기록 · 관리</div></div>
        <div class="arrow">›</div>
      </a>
      <a class="card" href="./trip/">
        <div class="icon">✈️</div>
        <div class="meta"><div class="name">가족 여행 플래너</div><div class="desc">가족 여행 일정 계획</div></div>
        <div class="arrow">›</div>
      </a>
    </div>
    <div class="foot">각 앱은 홈 화면에 따로 설치할 수 있어요<br/>앱 안에서 뒤로 가기를 누르면 이 목록으로 돌아옵니다</div>
  </div>
</body>
</html>
