<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="골프노트"/>
  <meta name="theme-color" content="#4ade80"/>
  <title>골프 공부 노트</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0f0b;
      --bg2: #0e150f;
      --bg3: #101a12;
      --border: #1a281c;
      --border2: #263a29;
      --accent: #4ade80;
      --accent2: #22a35a;
      --accent-dim: #16351f;
      --text: #eef2ec;
      --text2: #c4ccc2;
      --muted: #6b7a6d;
      --muted2: #47543f;
      --warm: #f4a94a;
      --red: #e0607a;
      --mono: 'DM Mono', monospace;
      --sans: 'Noto Sans KR', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overscroll-behavior: none;
    }

    #app { min-height: 100vh; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 10;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 16px;
      background: linear-gradient(180deg, #0d150e 0%, rgba(10,15,11,0.95) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-badge {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .header-title { font-size: 22px; font-weight: 900; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 300; }

    .sync-pill {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 12px; border-radius: 20px;
      background: var(--bg3); border: 1px solid var(--border2);
      font-size: 11.5px; font-weight: 500; color: var(--text2);
      cursor: pointer; -webkit-appearance: none; transition: all 0.15s;
    }
    .sync-pill:active { transform: scale(0.96); }
    .sync-pill.on { border-color: var(--accent2); color: var(--accent); background: var(--accent-dim); }
    .sync-pill.error { border-color: #5a2a34; color: var(--red); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .sync-pill.on .sync-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .sync-pill.connecting .sync-dot { background: var(--warm); animation: pulse 1s infinite; }
    .sync-pill.error .sync-dot { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Stats row ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-top: 16px;
    }
    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 12px; padding: 12px 10px;
      text-align: center;
    }
    .stat-num { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-num.warm { color: var(--warm); }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 0.02em; }

    /* ── Main ── */
    .main { padding: 16px 20px; max-width: 620px; margin: 0 auto; }

    /* ── Search + filter ── */
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
    }
    .search-box input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: var(--sans); font-size: 14px;
    }
    .search-box input::placeholder { color: var(--muted2); }
    .search-icon { font-size: 15px; opacity: 0.6; }

    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 18px; scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 8px 14px; border-radius: 20px;
      background: var(--bg2); border: 1px solid var(--border2);
      font-size: 12.5px; font-weight: 500; color: var(--text2);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
      -webkit-appearance: none;
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
      background: var(--accent-dim); border-color: var(--accent2); color: var(--accent);
    }
    .chip .cnt { font-family: var(--mono); font-size: 10px; opacity: 0.7; margin-left: 4px; }

    /* ── Note cards ── */
    .note-list { display: flex; flex-direction: column; gap: 12px; }
    .note-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 14px; padding: 16px;
      transition: border-color 0.15s;
    }
    .note-card:active { border-color: var(--accent2); }
    .note-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
    }
    .note-cat {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; font-weight: 700; color: var(--accent);
      background: var(--accent-dim); padding: 3px 9px; border-radius: 8px;
    }
    .note-date {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      margin-left: auto;
    }
    .note-menu {
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1;
      -webkit-appearance: none;
    }
    .note-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.35; }
    .note-body {
      font-size: 13.5px; color: var(--text2); line-height: 1.7;
      margin-top: 7px; white-space: pre-wrap; word-break: break-word;
    }
    .note-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .tag {
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
      background: var(--bg3); padding: 3px 8px; border-radius: 6px;
    }
    .tag::before { content: '#'; opacity: 0.5; }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.8; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; color: var(--muted2); line-height: 1.6; }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      right: 22px; z-index: 50;
      width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #06120a; font-size: 28px; font-weight: 300;
      cursor: pointer; box-shadow: 0 8px 24px rgba(34,163,90,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s; -webkit-appearance: none;
    }
    .fab:active { transform: scale(0.92); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: 100%; max-width: 620px;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 20px 20px 0 0;
      padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
      max-height: 92vh; overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px; background: var(--border2);
      margin: 0 auto 18px;
    }
    .modal-title { font-size: 17px; font-weight: 900; margin-bottom: 18px; }

    .field { margin-bottom: 15px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 7px;
    }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 10px; padding: 12px 13px;
      color: var(--text); font-family: var(--sans); font-size: 14px;
      outline: none; -webkit-appearance: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent2); }
    .field textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
    .field select { background-image: none; }

    .cat-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .cat-opt {
      padding: 8px 12px; border-radius: 10px;
      background: var(--bg3); border: 1px solid var(--border2);
      font-size: 12.5px; color: var(--text2); cursor: pointer;
      transition: all 0.12s; -webkit-appearance: none;
    }
    .cat-opt.active { background: var(--accent-dim); border-color: var(--accent2); color: var(--accent); font-weight: 700; }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn {
      flex: 1; padding: 14px; border-radius: 12px; border: none;
      font-family: var(--sans); font-size: 14.5px; font-weight: 700;
      cursor: pointer; transition: transform 0.12s; -webkit-appearance: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06120a; }
    .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); flex: 0 0 auto; padding: 14px 20px; }
    .btn-danger { background: transparent; border: 1px solid #5a2a34; color: var(--red); }

    /* ── Sync modal specifics ── */
    .sync-desc { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 18px; }
    .code-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 12px; padding: 6px 6px 6px 14px; margin-bottom: 8px;
    }
    .code-box input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--accent); font-family: var(--mono); font-size: 16px; letter-spacing: 0.04em;
    }
    .copy-btn {
      padding: 9px 13px; border-radius: 9px; border: none;
      background: var(--accent-dim); color: var(--accent);
      font-family: var(--sans); font-size: 12px; font-weight: 700; cursor: pointer;
      white-space: nowrap; -webkit-appearance: none;
    }
    .hint {
      font-size: 12px; color: var(--muted); line-height: 1.7;
      background: var(--bg3); border-radius: 10px; padding: 12px 14px; margin: 14px 0 4px;
      border-left: 2px solid var(--border2);
    }
    .hint b { color: var(--text2); }
    .status-line { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
    .status-line b { color: var(--accent); }

    /* ── Action sheet ── */
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 110;
      background: rgba(0,0,0,0.55); display: none;
      align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.show { display: flex; }
    .sheet {
      width: 100%; max-width: 620px; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      animation: slideUp 0.2s ease-out;
    }
    .sheet-group { background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
    .sheet-item {
      width: 100%; padding: 16px; background: none; border: none;
      color: var(--text); font-family: var(--sans); font-size: 15px; text-align: center;
      cursor: pointer; border-bottom: 1px solid var(--border);
      -webkit-appearance: none;
    }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-item.danger { color: var(--red); }
    .sheet-item.cancel { color: var(--muted); font-weight: 700; }

    /* ── Backup bar ── */
    .backup-bar {
      display: flex; gap: 10px; margin-top: 26px; padding-top: 20px;
      border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .backup-btn {
      flex: 1; min-width: 130px; padding: 11px; border-radius: 10px;
      background: var(--bg2); border: 1px solid var(--border2);
      color: var(--muted); font-family: var(--sans); font-size: 12.5px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; -webkit-appearance: none;
    }
    .backup-btn:active { background: var(--bg3); }

    .toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg3); border: 1px solid var(--accent2);
      color: var(--accent); padding: 11px 20px; border-radius: 24px;
      font-size: 13px; font-weight: 500; z-index: 200;
      opacity: 0; transition: all 0.25s; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Install banner ── */
    #install-banner {
      display: none;
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
      left: 12px; right: 12px; z-index: 90;
      background: linear-gradient(135deg, #10251a, #14311f);
      border: 1px solid #1f4a30;
      border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #install-banner.show { display: flex; align-items: center; gap: 12px; }
    .banner-text { flex: 1; font-size: 13px; color: #9fe0b6; line-height: 1.4; }
    .banner-text strong { color: var(--accent); font-size: 14px; display: block; margin-bottom: 2px; }
    .banner-btn {
      padding: 10px 16px; background: var(--accent); border: none; border-radius: 10px;
      font-family: var(--sans); font-size: 13px; font-weight: 700; color: #06120a;
      cursor: pointer; white-space: nowrap; -webkit-appearance: none;
    }
    .banner-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; line-height: 1; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="sync-pill" id="syncBtn"><span class="sync-dot"></span><span id="syncPillText">동기화</span></button>
    <div class="header-badge">Golf Study Journal · PWA</div>
    <div class="header-title">⛳ 골프 공부 노트</div>
    <div class="header-sub">배운 것을 기록하고, 다시 꺼내보며 실력을 쌓아요</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">전체 노트</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMonth">0</div>
        <div class="stat-label">이번 달</div>
      </div>
      <div class="stat-card">
        <div class="stat-num warm" id="statStreak">0</div>
        <div class="stat-label">연속 기록일</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="제목·내용·태그 검색"/>
    </div>

    <div class="filter-scroll" id="filterScroll"></div>

    <div class="note-list" id="noteList"></div>

    <div class="backup-bar">
      <button class="backup-btn" id="syncBtn2">☁️ 기기 간 동기화 설정</button>
      <button class="backup-btn" id="exportBtn">📤 백업 내보내기</button>
      <button class="backup-btn" id="importBtn">📥 백업 가져오기</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none"/>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="노트 추가">+</button>

<!-- 노트 작성/편집 모달 -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">새 노트</div>

    <div class="field">
      <label class="field-label">카테고리</label>
      <div class="cat-picker" id="catPicker"></div>
    </div>

    <div class="field">
      <label class="field-label">날짜</label>
      <input type="date" id="fDate"/>
    </div>

    <div class="field">
      <label class="field-label">제목</label>
      <input type="text" id="fTitle" placeholder="예) 백스윙 탑에서 손목 코킹 유지"/>
    </div>

    <div class="field">
      <label class="field-label">배운 내용 · 메모</label>
      <textarea id="fBody" placeholder="레슨 내용, 유튜브에서 배운 팁, 라운드 중 느낀 점 등 자유롭게 기록하세요."></textarea>
    </div>

    <div class="field">
      <label class="field-label">태그 (쉼표로 구분)</label>
      <input type="text" id="fTags" placeholder="예) 드라이버, 슬라이스교정, 김프로레슨"/>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 동기화 모달 -->
<div class="modal-backdrop" id="syncBackdrop">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">☁️ 기기 간 동기화</div>
    <div id="syncBody"></div>
  </div>
</div>

<!-- 노트 액션 시트 -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-group">
      <button class="sheet-item" id="sheetEdit">✏️ 수정</button>
      <button class="sheet-item danger" id="sheetDelete">🗑 삭제</button>
    </div>
    <div class="sheet-group">
      <button class="sheet-item cancel" id="sheetCancel">닫기</button>
    </div>
  </div>
</div>

<!-- 설치 배너 -->
<div id="install-banner">
  <div class="banner-text">
    <strong>홈 화면에 앱으로 설치</strong>
    앱처럼 전체화면으로, 오프라인에서도 사용할 수 있어요
  </div>
  <button class="banner-btn" id="installBtn">설치</button>
  <button class="banner-close" id="closeBanner">×</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Firebase 설정 (공개돼도 안전한 값) ──────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAv5S3y_2_jU9dAhJMCDUGTz28XGqIZVR0",
  authDomain: "golf-notes.firebaseapp.com",
  projectId: "golf-notes",
  storageBucket: "golf-notes.firebasestorage.app",
  messagingSenderId: "761506125302",
  appId: "1:761506125302:web:a99a7ae1ae1b683946e3d7"
};
const FB_VER = '10.12.5';

// ── 카테고리 정의 ───────────────────────────────────────────
const CATS = [
  { id: 'driver',  label: '드라이버',    emoji: '🏌️' },
  { id: 'iron',    label: '아이언',      emoji: '⛳' },
  { id: 'short',   label: '웨지·숏게임', emoji: '🎯' },
  { id: 'putt',    label: '퍼팅',        emoji: '🕳️' },
  { id: 'swing',   label: '스윙·자세',   emoji: '🔄' },
  { id: 'mental',  label: '멘탈·루틴',   emoji: '🧠' },
  { id: 'course',  label: '코스공략',    emoji: '🗺️' },
  { id: 'rule',    label: '규칙·에티켓', emoji: '📖' },
  { id: 'fit',     label: '체력·장비',   emoji: '💪' },
  { id: 'etc',     label: '기타',        emoji: '📝' },
];
const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];

const STORE_KEY = 'golf-notes-v1';
const CODE_KEY  = 'golf-sync-code';

// ── 상태 ────────────────────────────────────────────────────
let notes = load();          // 삭제 표식(tombstone) 포함 전체 배열
let activeFilter = 'all';
let searchTerm = '';
let editingId = null;
let selectedCat = 'driver';
let sheetTargetId = null;

let syncCode = localStorage.getItem(CODE_KEY) || null;
let syncStatus = 'off';      // off | connecting | on | error
let fb = null;               // { app, fs, db, ref, unsub }

// ── DOM ─────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const noteList = $('noteList');
const filterScroll = $('filterScroll');
const searchInput = $('searchInput');
const modalBackdrop = $('modalBackdrop');
const catPicker = $('catPicker');
const sheetBackdrop = $('sheetBackdrop');
const syncBackdrop = $('syncBackdrop');

// ── 저장/불러오기 ───────────────────────────────────────────
function load() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    arr.forEach(n => { if (!n.updated) n.updated = n.created || Date.now(); });
    return arr;
  } catch { return []; }
}
function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(notes)); }
function activeNotes() { return notes.filter(n => !n.deleted); }

// 로컬 저장 + 화면 갱신 + 클라우드 반영
function commit() { persist(); render(); pushToCloud(); }

// ── 렌더링 ──────────────────────────────────────────────────
function render() { renderStats(); renderFilters(); renderNotes(); }

function renderStats() {
  const live = activeNotes();
  $('statTotal').textContent = live.length;
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  $('statMonth').textContent = live.filter(n => (n.date||'').startsWith(ym)).length;
  $('statStreak').textContent = calcStreak(live);
}

function calcStreak(live) {
  if (!live.length) return 0;
  const days = new Set(live.map(n => n.date).filter(Boolean));
  let streak = 0;
  let d = new Date();
  const key = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  if (!days.has(key(d))) d.setDate(d.getDate() - 1);
  while (days.has(key(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

function renderFilters() {
  const live = activeNotes();
  const counts = {};
  live.forEach(n => counts[n.cat] = (counts[n.cat]||0) + 1);
  const items = [{ id: 'all', label: '전체', emoji: '📋', cnt: live.length }]
    .concat(CATS.filter(c => counts[c.id]).map(c => ({ ...c, cnt: counts[c.id] })));
  filterScroll.innerHTML = items.map(it => `
    <button class="chip ${activeFilter===it.id?'active':''}" data-filter="${it.id}">
      ${it.emoji} ${it.label}<span class="cnt">${it.cnt}</span>
    </button>`).join('');
}

function filteredNotes() {
  const term = searchTerm.trim().toLowerCase();
  return activeNotes()
    .filter(n => activeFilter === 'all' || n.cat === activeFilter)
    .filter(n => {
      if (!term) return true;
      const hay = `${n.title} ${n.body} ${(n.tags||[]).join(' ')}`.toLowerCase();
      return hay.includes(term);
    })
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
}

function renderNotes() {
  const list = filteredNotes();
  if (!list.length) {
    const first = activeNotes().length === 0;
    noteList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${first ? '⛳' : '🔍'}</div>
        <div class="empty-title">${first ? '첫 골프 노트를 남겨보세요' : '검색 결과가 없어요'}</div>
        <div class="empty-sub">${first
          ? '오른쪽 아래 <b>+</b> 버튼을 눌러<br/>오늘 배운 골프 지식을 기록해보세요.'
          : '다른 키워드나 카테고리로 찾아보세요.'}</div>
      </div>`;
    return;
  }
  noteList.innerHTML = list.map(n => {
    const c = catById(n.cat);
    const tags = (n.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    return `
    <div class="note-card">
      <div class="note-top">
        <span class="note-cat">${c.emoji} ${c.label}</span>
        <span class="note-date">${fmtDate(n.date)}</span>
        <button class="note-menu" data-menu="${n.id}">⋯</button>
      </div>
      <div class="note-title">${esc(n.title) || '(제목 없음)'}</div>
      ${n.body ? `<div class="note-body">${esc(n.body)}</div>` : ''}
      ${tags ? `<div class="note-tags">${tags}</div>` : ''}
    </div>`;
  }).join('');
}

// ── 필터/검색 ───────────────────────────────────────────────
filterScroll.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  activeFilter = b.dataset.filter;
  render();
});
searchInput.addEventListener('input', e => { searchTerm = e.target.value; renderNotes(); });

// ── 노트 메뉴 ───────────────────────────────────────────────
noteList.addEventListener('click', e => {
  const b = e.target.closest('.note-menu');
  if (!b) return;
  sheetTargetId = b.dataset.menu;
  sheetBackdrop.classList.add('show');
});
$('sheetCancel').addEventListener('click', () => sheetBackdrop.classList.remove('show'));
sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) sheetBackdrop.classList.remove('show'); });
$('sheetEdit').addEventListener('click', () => {
  sheetBackdrop.classList.remove('show');
  const n = notes.find(x => x.id === sheetTargetId);
  if (n) openModal(n);
});
$('sheetDelete').addEventListener('click', () => {
  sheetBackdrop.classList.remove('show');
  const n = notes.find(x => x.id === sheetTargetId);
  if (n) { n.deleted = true; n.updated = Date.now(); }
  commit(); toast('노트를 삭제했어요');
});

// ── 노트 모달 ───────────────────────────────────────────────
function renderCatPicker() {
  catPicker.innerHTML = CATS.map(c => `
    <button class="cat-opt ${selectedCat===c.id?'active':''}" data-cat="${c.id}">${c.emoji} ${c.label}</button>
  `).join('');
}
catPicker.addEventListener('click', e => {
  const b = e.target.closest('.cat-opt');
  if (!b) return;
  selectedCat = b.dataset.cat;
  renderCatPicker();
});

function openModal(note) {
  editingId = note ? note.id : null;
  selectedCat = note ? note.cat : (activeFilter !== 'all' ? activeFilter : 'driver');
  $('modalTitle').textContent = note ? '노트 수정' : '새 노트';
  $('fDate').value = note ? note.date : todayStr();
  $('fTitle').value = note ? note.title : '';
  $('fBody').value = note ? note.body : '';
  $('fTags').value = note ? (note.tags||[]).join(', ') : '';
  renderCatPicker();
  modalBackdrop.classList.add('show');
  setTimeout(() => $('fTitle').focus(), 100);
}
function closeModal() { modalBackdrop.classList.remove('show'); editingId = null; }

$('fab').addEventListener('click', () => openModal(null));
$('cancelBtn').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });

$('saveBtn').addEventListener('click', () => {
  const title = $('fTitle').value.trim();
  const body = $('fBody').value.trim();
  if (!title && !body) { toast('제목이나 내용을 입력해주세요'); return; }
  const tags = $('fTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const date = $('fDate').value || todayStr();

  if (editingId) {
    const n = notes.find(x => x.id === editingId);
    Object.assign(n, { cat: selectedCat, date, title, body, tags, updated: Date.now(), deleted: false });
    toast('수정했어요 ✓');
  } else {
    const t = Date.now();
    notes.push({ id: uid(), cat: selectedCat, date, title, body, tags, created: t, updated: t });
    toast('노트를 저장했어요 ⛳');
  }
  commit(); closeModal();
});

// ── 백업 내보내기/가져오기 ──────────────────────────────────
$('exportBtn').addEventListener('click', () => {
  const live = activeNotes();
  if (!live.length) { toast('내보낼 노트가 없어요'); return; }
  const blob = new Blob([JSON.stringify(live, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `골프노트_백업_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('백업 파일을 저장했어요 📤');
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      const map = {};
      notes.forEach(n => map[n.id] = n);
      data.forEach(n => {
        if (!n || !n.id) return;
        if (!n.updated) n.updated = n.created || Date.now();
        const ex = map[n.id];
        if (!ex || (n.updated||0) >= (ex.updated||0)) map[n.id] = n;
      });
      notes = Object.values(map);
      commit();
      toast(`${data.length}개 노트를 가져왔어요 📥`);
    } catch { toast('올바른 백업 파일이 아니에요'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ════════════════════════════════════════════════════════════
//  기기 간 동기화 (Firebase Firestore)
// ════════════════════════════════════════════════════════════
function setSyncStatus(s) {
  syncStatus = s;
  const pill = $('syncBtn');
  const txt = $('syncPillText');
  pill.className = 'sync-pill ' + (s === 'on' ? 'on' : s === 'connecting' ? 'connecting' : s === 'error' ? 'error' : '');
  txt.textContent = s === 'on' ? '동기화 켜짐' : s === 'connecting' ? '연결 중…' : s === 'error' ? '동기화 오류' : '동기화';
}

// 여러 기기의 노트를 id 기준으로 병합 (최신 updated 우선)
function mergeInto(base, incoming) {
  const map = {};
  base.forEach(n => map[n.id] = n);
  incoming.forEach(n => {
    if (!n || !n.id) return;
    const ex = map[n.id];
    if (!ex || (n.updated||0) > (ex.updated||0)) map[n.id] = n;
  });
  return Object.values(map);
}
function sig(arr) {
  return arr.map(n => `${n.id}:${n.updated||0}:${n.deleted?1:0}`).sort().join('|');
}

async function connectFirebase() {
  if (!syncCode) return;
  setSyncStatus('connecting');
  try {
    if (!fb) {
      const [appMod, fsMod] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`),
      ]);
      const app = appMod.initializeApp(firebaseConfig);
      const db = fsMod.getFirestore(app);
      fb = { app, fs: fsMod, db, ref: null, unsub: null };
    }
    if (fb.unsub) { fb.unsub(); fb.unsub = null; }
    fb.ref = fb.fs.doc(fb.db, 'spaces', syncCode);

    fb.unsub = fb.fs.onSnapshot(fb.ref, snap => {
      const remote = (snap.data() && snap.data().notes) || [];
      const merged = mergeInto(notes, remote);
      if (sig(merged) !== sig(notes)) { notes = merged; persist(); render(); }
      // 로컬에만 있는 변경이 있으면 서버로 올림
      if (sig(merged) !== sig(remote)) pushToCloud();
      setSyncStatus('on');
    }, err => { console.warn('sync error', err); setSyncStatus('error'); });

    setSyncStatus('on');
    pushToCloud();  // 최초 연결 시 로컬 데이터 업로드
  } catch (e) {
    console.warn('firebase connect failed', e);
    setSyncStatus('error');
  }
}

async function pushToCloud() {
  if (!fb || !fb.ref || syncStatus === 'off') return;
  try {
    await fb.fs.setDoc(fb.ref, { notes, updatedAt: Date.now() });
  } catch (e) {
    console.warn('push failed', e);
    setSyncStatus('error');
  }
}

function disableSync() {
  if (fb && fb.unsub) { fb.unsub(); fb.unsub = null; }
  fb = null; syncCode = null;
  localStorage.removeItem(CODE_KEY);
  setSyncStatus('off');
}

function genCode() {
  const alpha = '23456789abcdefghjkmnpqrstuvwxyz';
  const pick = n => Array.from(crypto.getRandomValues(new Uint8Array(n)))
    .map(x => alpha[x % alpha.length]).join('');
  return `golf-${pick(4)}-${pick(4)}`;
}

// ── 동기화 모달 UI ──────────────────────────────────────────
function openSync() {
  renderSyncBody();
  syncBackdrop.classList.add('show');
}
function closeSync() { syncBackdrop.classList.remove('show'); }

function renderSyncBody() {
  const body = $('syncBody');
  if (syncCode) {
    body.innerHTML = `
      <div class="status-line">상태: <b>${syncStatus === 'on' ? '연결됨 · 실시간 동기화 중' : syncStatus === 'connecting' ? '연결 중…' : '오프라인/오류'}</b></div>
      <div class="sync-desc">아래 <b>연결 코드</b>를 다른 기기(폰·데스크탑)의 같은 화면에 입력하면 노트가 자동으로 함께 보여요.</div>
      <label class="field-label">내 연결 코드</label>
      <div class="code-box">
        <input id="syncCodeShow" value="${esc(syncCode)}" readonly/>
        <button class="copy-btn" id="copyCodeBtn">복사</button>
      </div>
      <div class="hint">📱 <b>다른 기기 연결법</b><br/>그 기기에서 이 앱을 열고 → 상단 <b>동기화</b> → <b>다른 기기 코드 입력</b>에<br/>위 코드를 그대로 입력하면 끝!</div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="syncOffBtn">연동 끄기</button>
        <button class="btn btn-primary" id="syncDoneBtn">완료</button>
      </div>`;
    $('copyCodeBtn').addEventListener('click', () => copyText(syncCode));
    $('syncOffBtn').addEventListener('click', () => {
      disableSync(); renderSyncBody(); toast('동기화를 껐어요');
    });
    $('syncDoneBtn').addEventListener('click', closeSync);
  } else {
    const suggested = genCode();
    body.innerHTML = `
      <div class="sync-desc">폰과 데스크탑에서 <b>같은 코드</b>를 쓰면 노트가 실시간으로 함께 저장돼요. 이 코드가 곧 비밀번호이니 <b>남에게 알려주지 마세요.</b></div>
      <label class="field-label">① 새로 시작 — 이 코드를 쓰세요</label>
      <div class="code-box">
        <input id="newCodeInput" value="${suggested}"/>
        <button class="copy-btn" id="regenBtn">↻ 새로</button>
      </div>
      <button class="btn btn-primary" id="startNewBtn" style="width:100%; margin-top:6px;">이 코드로 동기화 시작</button>
      <div class="hint">이미 <b>다른 기기에서 코드를 만들었다면</b> 아래에 그 코드를 붙여넣으세요.</div>
      <label class="field-label">② 다른 기기 코드 입력 (연결)</label>
      <div class="code-box">
        <input id="joinCodeInput" placeholder="golf-xxxx-xxxx"/>
        <button class="copy-btn" id="joinBtn">연결</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="syncCancelBtn">닫기</button>
      </div>`;
    $('regenBtn').addEventListener('click', () => { $('newCodeInput').value = genCode(); });
    $('startNewBtn').addEventListener('click', () => startSync($('newCodeInput').value));
    $('joinBtn').addEventListener('click', () => startSync($('joinCodeInput').value));
    $('syncCancelBtn').addEventListener('click', closeSync);
  }
}

function startSync(rawCode) {
  const code = (rawCode || '').trim().toLowerCase();
  if (code.length < 10) { toast('코드는 10자 이상이어야 해요'); return; }
  if (!/^[a-z0-9-]+$/.test(code)) { toast('영문 소문자·숫자·하이픈만 사용하세요'); return; }
  syncCode = code;
  localStorage.setItem(CODE_KEY, code);
  renderSyncBody();
  connectFirebase();
  toast('동기화를 시작했어요 ☁️');
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('코드를 복사했어요 ✓'); }
  catch {
    const el = $('syncCodeShow'); if (el) { el.select(); document.execCommand('copy'); toast('코드를 복사했어요 ✓'); }
  }
}

$('syncBtn').addEventListener('click', openSync);
$('syncBtn2').addEventListener('click', openSync);
syncBackdrop.addEventListener('click', e => { if (e.target === syncBackdrop) closeSync(); });

// ── 유틸 ────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  const today = todayStr();
  if (s === today) return '오늘';
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestStr = `${yest.getFullYear()}-${String(yest.getMonth()+1).padStart(2,'0')}-${String(yest.getDate()).padStart(2,'0')}`;
  if (s === yestStr) return '어제';
  return `${Number(m)}월 ${Number(d)}일`;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── PWA 설치 ────────────────────────────────────────────────
let deferredPrompt = null;
const banner = $('install-banner');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; banner.classList.add('show');
});
$('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  banner.classList.remove('show');
  deferredPrompt = null;
});
$('closeBanner').addEventListener('click', () => banner.classList.remove('show'));
window.addEventListener('appinstalled', () => { banner.classList.remove('show'); deferredPrompt = null; });

// ── Service Worker ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

// ── 초기 실행 ───────────────────────────────────────────────
render();
setSyncStatus(syncCode ? 'connecting' : 'off');
if (syncCode) connectFirebase();
</script>
</body>
</html>
